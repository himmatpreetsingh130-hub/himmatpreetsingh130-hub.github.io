<style>
:root{
  color-scheme:light;
  --sheet:#f7f4ff;
  --ink:#171a3a;
  --muted:#6b6890;
  --pink:#ff3fa4;
  --violet:#9b5cff;
  --navy:#1c2340;
  --green:#12b564;
}
*{box-sizing:border-box;margin:0}
html{min-height:100%}
body{
  min-height:100svh;
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(60% 40% at 90% 8%,rgba(255,92,190,.45),transparent 70%),
    radial-gradient(70% 45% at 5% 30%,rgba(110,150,255,.40),transparent 70%),
    linear-gradient(165deg,#a584ff 0%,#c6b4ff 38%,#ebe4ff 72%,#faf8ff 100%);
  background-attachment:fixed;
  display:flex;justify-content:center;align-items:center;
  padding:max(28px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));
  overflow-x:hidden;
}
.orb{position:fixed;border-radius:50%;filter:blur(50px);opacity:.55;pointer-events:none;z-index:0;animation:drift 16s ease-in-out infinite alternate}
.orb.a{width:260px;height:260px;background:#ff7ac8;top:-60px;right:-70px}
.orb.b{width:300px;height:300px;background:#7fa6ff;bottom:-90px;left:-100px;animation-duration:20s}
.orb.c{width:180px;height:180px;background:#c18bff;top:42%;right:-80px;animation-duration:13s}
@keyframes drift{to{transform:translate(-30px,40px) scale(1.12)}}

main{position:relative;z-index:1;width:100%;max-width:400px;padding-top:70px}

.doodle{position:absolute;stroke:var(--ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.doodle.heart{width:34px;top:0;right:14px;transform:rotate(12deg)}
.doodle.arrow{width:70px;top:52px;left:6px}
.doodle.spark{width:28px;top:14px;left:44px;stroke:#fff;stroke-width:3.5}

.avatar-wrap{position:relative;width:136px;height:136px;margin:0 auto -68px;z-index:2}
.avatar-wrap::before{
  content:"";position:absolute;inset:-6px;border-radius:50%;
  background:conic-gradient(from 0deg,#ff3fa4,#9b5cff,#5aa2ff,#ff3fa4);
  animation:spin 7s linear infinite;
}
.avatar{
  position:absolute;inset:0;border-radius:50%;
  background:#000;border:5px solid var(--sheet);
  overflow:hidden;isolation:isolate;
  box-shadow:0 14px 30px rgba(80,40,160,.35);
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;mix-blend-mode:screen}
@keyframes spin{to{transform:rotate(360deg)}}

.sheet{
  position:relative;
  background:var(--sheet);
  border-radius:34px;
  padding:88px 18px 22px;
  text-align:center;
  box-shadow:0 30px 60px rgba(90,50,180,.28),0 2px 0 rgba(255,255,255,.8) inset;
}
.sheet::before{
  content:"";position:absolute;left:50%;top:-34px;width:188px;height:188px;
  transform:translateX(-50%);border-radius:50%;background:var(--sheet);z-index:0;
}
.sheet>*{position:relative;z-index:1}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.tag{margin-top:6px;color:var(--muted);font-weight:600;font-size:.95rem}

ul{list-style:none;padding:0;margin-top:26px;display:grid;gap:12px}
.btn{
  display:flex;align-items:center;gap:14px;
  min-height:64px;padding:0 20px;border-radius:20px;
  text-decoration:none;text-align:left;font-weight:700;font-size:1.02rem;
  color:#fff;
  box-shadow:0 10px 20px rgba(60,30,140,.2);
  transition:transform .15s,box-shadow .15s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px rgba(60,30,140,.28)}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.dot:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn svg.ic{width:28px;height:28px;fill:currentColor;flex:none}
.btn .label{flex:1;line-height:1.2}
.btn .label small{display:block;font-weight:600;font-size:.78rem;opacity:.8;margin-top:2px}
.btn svg.go{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ig{background:linear-gradient(95deg,#ff4f9a,#c155ff 60%,#8f5cff)}
.yt{background:var(--navy)}
.wa{background:var(--green)}
.call{background:#fff;color:var(--ink);box-shadow:0 8px 18px rgba(60,30,140,.14),0 0 0 1px rgba(110,90,190,.12) inset}

.socials{display:flex;justify-content:center;gap:14px;margin-top:24px}
.dot{
  width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;
  box-shadow:0 8px 16px rgba(60,30,140,.22);transition:transform .15s;
}
.dot:hover{transform:translateY(-3px) scale(1.06)}
.dot svg{width:22px;height:22px;fill:currentColor}
.dot.ig{background:linear-gradient(135deg,#ff4f9a,#8f5cff)}
.dot.yt{background:#ff1f3d}
.dot.wa{background:var(--green)}
.dot.call{background:var(--navy);color:#fff}

/* one load sequence */
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*90ms + 150ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}}

@media (prefers-reduced-motion:reduce){
  .orb,.avatar-wrap::before,.rise{animation:none}
  .btn,.dot{transition:none}
}
</style>
